interfaces interface lo
  type iana-if-type:ethernetCsmacd
  ipv4 address 10.0.2.0 prefix-length 24
  ipv6
!
interface interface eth0
  type iana-if-type:ethernetCsmacd
  ipv4 address 10.0.1.2 prefix-length 30
  ipv6
!
routing control-plane-protocols control-plane-protocol ietf-bgp:bgp main
  bgp global as 65002
  bgp global identifier 10.0.1.2
  bgp global afi-safis afi-safi iana-bgp-types:ipv4-unicast
    enabled true
	ipv4-unicast redistribution ietf-routing:direct
	apply-policy import-policy EXPORT
  bgp neighbors neighbor 10.0.1.1
    peer-as 65001
	enabled true
	transport local-address 10.0.1.2
    transport tls ca-chain /etc/holo/ca.cert.pem
    transport tls cert /etc/holo/router.cert.pem
    transport tls pkey /etc/holo/router.key
    transport tls sni r0.asn65001.example.com
	trace-options flag packets-all
	trace-options flag events
	afi-safis afi-safi iana-bgp-types:ipv4-unicast
	  enabled true
	  apply-policy import-policy IMPORT
	  apply-policy default-export-policy accept-route
!
routing-policy defined-sets prefix-sets prefix-set MY_PREFIX ipv4
  prefixes prefix-list 10.0.2.0/24 24 24

routing-policy defined-sets prefix-sets prefix-set THEIR_PREFIX ipv4
  prefixes prefix-list 10.0.1.0/24 24 24

routing-policy policy-definitions policy-definition IMPORT
  statements statement 1
    conditions match-prefix-set prefix-set THEIR_PREFIX
	actions policy-result accept-route

routing-policy policy-definitions policy-definition EXPORT
  statements statement 1
    conditions match-prefix-set prefix-set MY_PREFIX
	actions policy-result accept-route
